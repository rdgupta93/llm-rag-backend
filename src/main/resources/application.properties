spring.application.name=llm-rag-backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/llm_rag
spring.datasource.username=postgres
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=DEBUG

# JWT
jwt.secret=VGhpcy1pcy1hLXN1cGVyLXNlY3JldC1rZXktZm9yLWxsbS1yYWctYXBwLTIwMjY=
jwt.expiration=86400000

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=10MB

# Maximum total size of a multipart request
spring.servlet.multipart.max-request-size=10MB

# Document upload directory
app.upload.dir=uploads/documents